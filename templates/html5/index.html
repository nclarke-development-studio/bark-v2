<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Main</title>

    <meta
      id="viewport"
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="shortcut icon" type="image/png" href="./favicon.png" />

    <script type="text/javascript" src="./Bark.js"></script>

    <script>
      window.addEventListener(
        "touchmove",
        function (event) {
          event.preventDefault();
        },
        { capture: false, passive: false },
      );
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      #openfl-content {
        background: #000000;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <noscript
      >This webpage makes extensive use of JavaScript. Please enable JavaScript
      in your web browser to view this page.</noscript
    >

    <div id="openfl-content"></div>

    <div
      id="dpi-warning"
      style="
        display: none;
        background: #fff3cd;
        color: #856404;
        padding: 10px;
        text-align: center;
        font-family: sans-serif;
        font-size: 14px;
        border-bottom: 1px solid #ffeeba;
        position: relative;
        z-index: 9999;
      "
    >
      <strong>Notice:</strong> High-DPI touch device detected. If the layout
      appears overly zoomed, please use the native desktop (HashLink) build for
      an optimal experience.
      <button
        onclick="document.getElementById('dpi-warning').style.display = 'none'"
        style="
          margin-left: 15px;
          cursor: pointer;
          border: 1px solid #856404;
          background: transparent;
          border-radius: 3px;
        "
      >
        Dismiss
      </button>
    </div>

    <script>
      // check if it's a high-pixel-density screen AND supports touch
      if (
        window.devicePixelRatio > 1.2 &&
        ("ontouchstart" in window || navigator.maxTouchPoints > 0)
      ) {
        document.getElementById("dpi-warning").style.display = "block";
      }
    </script>

    <script type="text/javascript">
      lime.embed("Bark", "openfl-content", 0, 0, { parameters: {} });
    </script>
  </body>
</html>
